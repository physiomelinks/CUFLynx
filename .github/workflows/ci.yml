name: CI

on:
  push:
    branches: [main, devel_FA]
  pull_request:

jobs:
  # `pip install -e .` is how a user installs from source (scripts/install.py runs
  # exactly this), and nothing in CI exercised it: every other job installs the
  # dependencies by hand, so the packaging metadata was never built. A readme path
  # pointing outside apps/api sat here working until a fresh environment resolved a
  # hatchling strict enough to refuse it -- and then every clean clone failed at
  # install, with the next release build queued to fail the same way.
  #
  # --no-deps deliberately: this asks whether the *metadata* builds, which is the
  # part that broke. Installing the real dependency set is minutes of CI for a
  # question the other jobs already answer.
  packaging:
    name: Editable install (packaging metadata)
    runs-on: ubuntu-latest
    # Every job here runs in seconds to ~2 minutes, so 15 is a backstop rather than a
    # budget: without one, a job that hangs holds a runner until GitHub's 360-minute
    # default. release.yml carries the same backstop, after `Install Sundials (Linux)`
    # stalled in apt for 1h40m on the v0.4.0 re-tag and had to be cancelled by hand.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install from source, as a user would
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
      - name: The installed package is importable and self-describing
        run: |
          python -c "import importlib.metadata as m; print(m.version('cuflynx-api'))"

      # A repo-level check, so it belongs in a job that runs once rather than in the
      # per-Python matrix. `working-directory` explicitly, because this job defaults to
      # apps/api and the script lives at the root -- which is exactly how the first attempt
      # at this failed, and passed on Windows only because that job never got the step.
      - name: The version is in sync across its three files
        working-directory: ${{ github.workspace }}
        run: python scripts/sync_version.py --check

  # ONE job for every OS, not one per OS. This was two near-identical copies --
  # ubuntu and windows -- which is exactly how a platform-specific check goes
  # missing: the macOS half of #340 and #330 both reached users because nothing
  # above the Linux unit tier ran anywhere else. A matrix cannot drift from
  # itself.
  #
  # macOS and Windows runners are billed at 10x and 2x, but this repository is
  # public, so Actions minutes are free; the real cost here is wall clock, and
  # this tier is minutes.
  backend-unit:
    name: Backend unit (${{ matrix.os }}, no Myokit, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the top deliberately: autoemulate declares requires-python <3.13, and
        # while this tier does not install it, moving past the engine's own ceiling would
        # test an interpreter libcuflynx cannot fully support (circulatory_autogen#459).
        # 3.10 stays as the floor because that is what libcuflynx requires (#278).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    env:
      # The params_for_id CSV -> JSON conversion is CA's alone (no local
      # fallback), so the unit tier needs CA's parser importable. The pin is
      # bumped deliberately -- upstream drift must not break CUFLynx CI.
      CIRCULATORY_AUTOGEN_SRC: ${{ github.workspace }}/circulatory_autogen/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: physiomelinks/circulatory_autogen
          # A commit on master, bumped deliberately -- upstream drift must not break
          # CUFLynx CI. This one is the merge of circulatory_autogen#495, the first CA
          # carrying libcuflynx.parsers.MyokitParsers and .EasyMLParsers, which this
          # app delegates every .mmt and .model conversion to with no local fallback.
          ref: 577cd4efea063f1b0b9dce79399eaad6386eac58
          path: circulatory_autogen
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install only the light deps needed by the unit tier; the heavy
      # simulation stack (myokit/libcellml) is exercised by the integration
      # marker, which is skipped here. pyyaml is for CA's parser module.
      # matplotlib is for the extra-figure pipeline: without it the
      # sim-worker child degrades to "no extra figures" by design, which
      # would silently gut test_solver_plots_worker's drift guards.
      - name: Install unit-test deps
        run: pip install fastapi "uvicorn[standard]" numpy pandas pyyaml python-multipart httpx matplotlib pytest pytest-cov
      - name: Run unit tests
        run: pytest -m "not integration" -q

  frontend:
    name: Frontend tests + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # All three, because the frontend suite now carries source-level contracts
      # about how the app leaves the page (externalLinks.test.js), and those read
      # files off disk -- a path or line-ending assumption that only breaks on
      # Windows is exactly the kind of thing this catches.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Unit tests
        run: yarn test
      - name: Build
        run: yarn build

  # The one macOS job on the PR path, and deliberately small.
  #
  # A user opening the packaged macOS app hit
  #   DistutilsExecError: command '/usr/bin/clang' failed with exit code 1
  # because compiler detection asked shutil.which(), and on macOS /usr/bin/cc,
  # /usr/bin/gcc and /usr/bin/clang are xcrun shims shipped by the OS that are
  # ALWAYS present -- exiting 1 when no toolchain is installed behind them. The
  # app promised CVODE_myokit and the run died inside distutils, with the reason
  # going to a console a double-clicked app does not have.
  #
  # tests/test_compiler_check.py pins the logic hermetically and runs in the unit
  # tiers on all three OSes. What it *cannot* check is whether real macOS behaves
  # as those tests assume, since it builds its own fake shims. This job is that
  # check, and only that: two states on one architecture, ~3 minutes.
  #
  # The full grid -- four toolchain states x both architectures, plus the packaged
  # binary opened under each -- is .github/workflows/mac-extended.yml, which is
  # far too slow for a PR and runs weekly and on demand instead.
  macos-compiler-detection:
    name: Compiler detection is true on macOS (${{ matrix.state }})
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # xcode: detection must not have gone pessimistic on a healthy machine.
        # no-toolchain: the reported bug, which the shipped code fails.
        state: [xcode, no-toolchain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The interpreter the release build freezes.
          python-version: "3.10"
      # setuptools is what Myokit compiles through, and is no longer in a default
      # 3.12+ venv -- install it rather than inherit the image's.
      - name: Install setuptools
        run: python -m pip install --upgrade pip setuptools
      - name: Probe the toolchain
        run: |
          set -uo pipefail
          # Exported here, not in an `env:` block: a falsy expression there sets
          # the variable to the empty string rather than leaving it unset, and an
          # empty DEVELOPER_DIR is not the same as none -- it would perturb the
          # baseline this is compared against.
          if [ "${{ matrix.state }}" = "no-toolchain" ]; then
            export DEVELOPER_DIR=/var/empty
            EXPECT=absent
          else
            EXPECT=present
          fi
          python scripts/mac_toolchain_probe.py \
            --label "${{ matrix.state }}" --expect "$EXPECT"
