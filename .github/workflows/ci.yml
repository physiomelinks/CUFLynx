name: CI

on:
  push:
    branches: [main, devel_FA]
  pull_request:

jobs:
  # `pip install -e .` is how a user installs from source (scripts/install.py runs
  # exactly this), and nothing in CI exercised it: every other job installs the
  # dependencies by hand, so the packaging metadata was never built. A readme path
  # pointing outside apps/api sat here working until a fresh environment resolved a
  # hatchling strict enough to refuse it -- and then every clean clone failed at
  # install, with the next release build queued to fail the same way.
  #
  # --no-deps deliberately: this asks whether the *metadata* builds, which is the
  # part that broke. Installing the real dependency set is minutes of CI for a
  # question the other jobs already answer.
  packaging:
    name: Editable install (packaging metadata)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install from source, as a user would
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
      - name: The installed package is importable and self-describing
        run: |
          python -c "import importlib.metadata as m; print(m.version('cuflynx-api'))"

  backend-unit:
    name: Backend unit tests (no Myokit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # The params_for_id CSV -> JSON conversion is CA's alone (no local
      # fallback), so the unit tier needs CA's parser importable. The pin is
      # bumped deliberately -- upstream drift must not break CUFLynx CI.
      CIRCULATORY_AUTOGEN_SRC: ${{ github.workspace }}/circulatory_autogen/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: physiomelinks/circulatory_autogen
          ref: d2f6cf73fbc37acececa974d992af9ad40780634
          path: circulatory_autogen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Install only the light deps needed by the unit tier; the heavy
      # simulation stack (myokit/libcellml) is exercised by the integration
      # marker, which is skipped here. pyyaml is for CA's parser module.
      - name: Install unit-test deps
        run: pip install fastapi "uvicorn[standard]" numpy pandas pyyaml python-multipart httpx pytest pytest-cov
      - name: Run unit tests
        run: pytest -m "not integration" -q

  backend-unit-windows:
    name: Backend unit tests (Windows, no Myokit)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CIRCULATORY_AUTOGEN_SRC: ${{ github.workspace }}/circulatory_autogen/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: physiomelinks/circulatory_autogen
          ref: d2f6cf73fbc37acececa974d992af9ad40780634
          path: circulatory_autogen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same light deps as the Ubuntu unit job; the heavy simulation stack
      # (myokit/libcellml) is exercised by the integration marker, skipped here.
      - name: Install unit-test deps
        run: pip install fastapi "uvicorn[standard]" numpy pandas pyyaml python-multipart httpx pytest pytest-cov
      - name: Run unit tests
        run: pytest -m "not integration" -q

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Unit tests
        run: yarn test
      - name: Build
        run: yarn build
