name: CI

on:
  push:
    branches: [main, devel_FA]
  pull_request:

jobs:
  # `pip install -e .` is how a user installs from source (scripts/install.py runs
  # exactly this), and nothing in CI exercised it: every other job installs the
  # dependencies by hand, so the packaging metadata was never built. A readme path
  # pointing outside apps/api sat here working until a fresh environment resolved a
  # hatchling strict enough to refuse it -- and then every clean clone failed at
  # install, with the next release build queued to fail the same way.
  #
  # --no-deps deliberately: this asks whether the *metadata* builds, which is the
  # part that broke. Installing the real dependency set is minutes of CI for a
  # question the other jobs already answer.
  packaging:
    name: Editable install (packaging metadata)
    runs-on: ubuntu-latest
    # Every job here runs in seconds to ~2 minutes, so 15 is a backstop rather than a
    # budget: without one, a job that hangs holds a runner until GitHub's 360-minute
    # default. release.yml carries the same backstop, after `Install Sundials (Linux)`
    # stalled in apt for 1h40m on the v0.4.0 re-tag and had to be cancelled by hand.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install from source, as a user would
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
      - name: The installed package is importable and self-describing
        run: |
          python -c "import importlib.metadata as m; print(m.version('cuflynx-api'))"

  backend-unit:
    name: Backend unit tests (no Myokit, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the top deliberately: autoemulate declares requires-python <3.13, and while
        # this tier does not install it, moving past the engine's own ceiling would test an
        # interpreter libcuflynx cannot fully support (circulatory_autogen#459). 3.10 stays as
        # the floor because that is what libcuflynx requires (#278).
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    env:
      # The params_for_id CSV -> JSON conversion is CA's alone (no local
      # fallback), so the unit tier needs CA's parser importable. The pin is
      # bumped deliberately -- upstream drift must not break CUFLynx CI.
      CIRCULATORY_AUTOGEN_SRC: ${{ github.workspace }}/circulatory_autogen/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: physiomelinks/circulatory_autogen
          # A commit on master, bumped deliberately -- upstream drift must not break
          # CUFLynx CI.
          # TEMPORARY, until the circulatory_autogen side of this change is on master.
          # The Myokit reader moved into libcuflynx.parsers.MyokitParsers and the
          # EasyML one is new there, and this app now delegates to both with no local
          # fallback -- so a CA predating them fails the .mmt tests rather than
          # skipping them. Flip back to a pinned master commit once CA merges.
          ref: feat/easyml-import
          path: circulatory_autogen
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install only the light deps needed by the unit tier; the heavy
      # simulation stack (myokit/libcellml) is exercised by the integration
      # marker, which is skipped here. pyyaml is for CA's parser module.
      # matplotlib is for the extra-figure pipeline: without it the
      # sim-worker child degrades to "no extra figures" by design, which
      # would silently gut test_solver_plots_worker's drift guards.
      - name: Install unit-test deps
        run: pip install fastapi "uvicorn[standard]" numpy pandas pyyaml python-multipart httpx matplotlib pytest pytest-cov
      - name: Run unit tests
        run: pytest -m "not integration" -q

  backend-unit-windows:
    name: Backend unit tests (Windows, no Myokit, ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the top deliberately: autoemulate declares requires-python <3.13, and while
        # this tier does not install it, moving past the engine's own ceiling would test an
        # interpreter libcuflynx cannot fully support (circulatory_autogen#459). 3.10 stays as
        # the floor because that is what libcuflynx requires (#278).
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    env:
      CIRCULATORY_AUTOGEN_SRC: ${{ github.workspace }}/circulatory_autogen/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: physiomelinks/circulatory_autogen
          # A commit on master, bumped deliberately -- upstream drift must not break
          # CUFLynx CI.
          # TEMPORARY, until the circulatory_autogen side of this change is on master.
          # The Myokit reader moved into libcuflynx.parsers.MyokitParsers and the
          # EasyML one is new there, and this app now delegates to both with no local
          # fallback -- so a CA predating them fails the .mmt tests rather than
          # skipping them. Flip back to a pinned master commit once CA merges.
          ref: feat/easyml-import
          path: circulatory_autogen
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same light deps as the Ubuntu unit job (matplotlib included for the
      # extra-figure drift guards); the heavy simulation stack
      # (myokit/libcellml) is exercised by the integration marker, skipped here.
      - name: Install unit-test deps
        run: pip install fastapi "uvicorn[standard]" numpy pandas pyyaml python-multipart httpx matplotlib pytest pytest-cov
      - name: Run unit tests
        run: pytest -m "not integration" -q

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Unit tests
        run: yarn test
      - name: Build
        run: yarn build
