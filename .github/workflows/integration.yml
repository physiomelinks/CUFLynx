name: Integration

# What this workflow exists for, in one sentence: **nothing in CUFLynx CI has ever run
# `pytest -m integration`.**
#
# `ci.yml` has four jobs. Three of them run `pytest -m "not integration"`, and their own
# comments say the heavy stack "is exercised by the integration marker" -- but no job
# selects that marker, so the whole tier has been dead in CI since it was written. The
# fourth (`packaging`) installs with `--no-deps` on purpose.
#
# The second gap is what CA *is* during those runs. `apps/api/pyproject.toml` declares
# `libcuflynx>=0.4.0` as an ordinary dependency, but `backend-unit` checks out
# circulatory_autogen at a pinned commit and points `CIRCULATORY_AUTOGEN_SRC` at its
# `src/`. So the declared dependency is never installed, and the layout under test is a
# checkout on `sys.path` -- not what users get from `pip install`, and not what the frozen
# app ships. `ca_imports.installed_package_available()` exists precisely because those two
# are different questions.
#
# So: install libcuflynx as a package, do not set CIRCULATORY_AUTOGEN_SRC, and run the
# tier. Then run the analyses at more than one core, which nothing anywhere does.

on:
  push:
    branches: [main, devel_FA]
  pull_request:
  # Weekly, unpinned. See the `dependency-upgrade` job -- the bug that prompted all of
  # this arrived from upstream rather than from a commit here, and a suite that only runs
  # on pull requests can only find that kind by accident, on someone's morning run.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Keep UCX off the RDMA devices the Azure runners expose but cannot use. Every job
# below launches mpiexec, and on a runner whose VM presents a MANA NIC with verbs
# support UCX probes it, fails, and takes MPI_Init down with it:
#
#     ib_iface.c:1316 UCX ERROR mana_0: iface ... failed to create UD QP ...
#         failed: Operation not supported
#     Abort(941770127): Fatal error in internal_Init_thread ... MPIDI_UCX_init_local
#
# The job dies at exit 143 before a single test runs, and only on the runners that
# happen to have the device -- so it presents as an intermittent failure unrelated to
# whatever was pushed. release.yml already pins the same variable for the same reason
# (it lost 2 of 3 release builds to the sibling "invalid bandwidth 0.00" form); this is
# that fix, in the workflow that actually runs MPI rather than just importing it.
# Two ranks on one VM need no fabric, so nothing is given up by saying so.
env:
  UCX_TLS: "tcp,self"

jobs:
  # ---------------------------------------------------------------------------
  # The integration tier, against an installed libcuflynx
  # ---------------------------------------------------------------------------
  # `pytest -m integration` collects **258 tests**, none of which had ever run on CI
  # before this workflow. `min_ran` is a floor on how many actually execute, not a target.
  # The first run reported **258 collected, 10 skipped, 248 ran**, so the floor is 240 --
  # tight enough that the tier collapsing is visible, loose enough to absorb an optional
  # backend going missing on a runner. `assert_tests_ran.py` prints the real number every
  # run; if it drifts far below 240, find out why before lowering this.
  integration:
    name: Integration tier (installed libcuflynx, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    # The tier is minutes, the installs are most of the wall clock, and `full` drags in
    # torch. Generous enough for a cold pip cache, tight enough that a hang is reported
    # rather than held to GitHub's 360-minute default -- the failure mode that turned
    # release.yml's Sundials step into a 1h40m stall.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # What a user gets from `pip install cuflynx-api[analysis]`: simulation,
          # sensitivity, calibration, the emcee sampler, and a self-contained MPICH.
          - extras: "dev,analysis"
            min_ran: 240
          # Adds autoemulate + pymc + arviz -- the emulator and pyMC UQ paths, and the
          # only leg where arviz is present at all. That matters beyond the features: it
          # is the configuration the reported four-rank crash was running under.
          - extras: "dev,analysis,full"
            min_ran: 240
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Myokit JIT-compiles each model against Sundials at run time, so the integration
      # tier cannot simulate anything without the headers. Same apt handling as
      # release.yml, and for the same reason recorded there: the runner image's Azure
      # mirror has hung this step for over an hour with no output.
      - name: Install Sundials
        run: |
          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt || true
          echo 'Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-cuflynx-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y libsundials-dev python3-dev

      # No system MPI, deliberately: `[analysis]` pip-installs a self-contained MPICH
      # next to the interpreter, which is what `calibration.resolve_mpiexec` looks for
      # first and what guarantees the launcher and mpi4py come from the same MPI. A
      # system Open MPI here would be a *different* MPI from the one mpi4py binds, and
      # every rank would abort at MPI_Init with "unsupported PMI version PMIx" -- the
      # exact failure resolve_mpiexec was written to avoid.
      # --build-constraint, not a runtime pin: the `full` extra reaches `harmonic`,
      # which has no cp310 wheel, so pip builds its sdist here. See
      # build-constraints.txt for what that ceiling is holding back.
      - name: Install the app and its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --build-constraint "${{ github.workspace }}/build-constraints.txt" \
            -e ".[${{ matrix.extras }}]"

      # TEMPORARY, until circulatory_autogen publishes a release containing #466. The
      # declared dependency is
      # `libcuflynx>=0.4.0` from PyPI, which is 0.4.1 and predates the CA changes this
      # release ships with. Installed *after* the app so it overrides that resolution,
      # and still as a real distribution in site-packages -- so
      # CUFLYNX_REQUIRE_INSTALLED_LIBCUFLYNX below still means what it says.
      - name: Install libcuflynx from the CA integration branch
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-cache-dir \
            --build-constraint "${{ github.workspace }}/build-constraints.txt" \
            "libcuflynx[emulation,uq] @ git+https://github.com/physiomelinks/circulatory_autogen@master"

      # Fail here rather than 20 minutes later in a wall of skips. Each of these is a
      # dependency the tier silently degrades without, and the point of this job is that
      # CA arrives as an installed distribution rather than as a checkout.
      - name: Assert the environment is the one under test
        run: |
          python - <<'PY'
          import importlib.metadata as m, pathlib, shutil, sys
          version = m.version("libcuflynx")
          import libcuflynx, myokit, libcellml  # noqa: F401
          origin = pathlib.Path(libcuflynx.__file__).resolve()
          assert origin.parent.parent.name != "src", (
              f"libcuflynx resolved to a checkout at {origin} -- this job exists to test "
              f"the installed package")
          launcher = pathlib.Path(sys.executable).parent / "mpiexec"
          assert launcher.exists() or shutil.which("mpiexec"), (
              "no mpiexec: the parallel arm of the run matrix would silently run serially")
          print(f"libcuflynx {version} (installed), myokit + libcellml + mpiexec present")
          PY

      # CIRCULATORY_AUTOGEN_SRC is deliberately NOT set. Everything below resolves CA
      # through the installed package, the way a user with no CA directory configured
      # does -- a path no other job here takes.
      - name: Run the integration tier
        env:
          CUFLYNX_REQUIRE_INSTALLED_LIBCUFLYNX: "1"
          # Turn the swallowed optional-import failures in libcuflynx back into raises.
          # Production wants the wide catch; CI wants to know. (CA #467.)
          CUFLYNX_STRICT_STARTUP: "1"
        run: |
          pytest -m integration -v --tb=short --junitxml=junit-integration.xml

      # pytest exits 0 when every test skipped, so the step above can pass having run
      # none of the tier. That is the likely failure here, not a red X.
      - name: Fail if the tier did not actually run
        if: always()
        working-directory: .
        run: |
          python .github/scripts/assert_tests_ran.py \
            --min-ran ${{ matrix.min_ran }} apps/api/junit-integration.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.extras }}
          path: apps/api/junit-integration.xml

  # ---------------------------------------------------------------------------
  # The run matrix: every analysis, serial and parallel
  # ---------------------------------------------------------------------------
  # The simulation half of the integration tier, on the two platforms nothing
  # above the unit tier has ever run on.
  #
  # Reduced on purpose, in one specific way: it installs `[dev]` and NOT
  # `[analysis]`, so there is no mpi4py and no MPI. That is not a shortcut -- MPI
  # is where per-OS integration testing gets expensive and flaky (MS-MPI on
  # Windows, and the MPICH-vs-OpenMPI trap of #330 on macOS), while the bugs that
  # actually reached users were in simulation and packaging. The parallel arm
  # stays Ubuntu-only in `run-matrix` below.
  #
  # No test deselection is needed to achieve that: the analysis tests take the
  # `requires_simulation` / optional-dependency fixtures and skip themselves when
  # emcee/SALib/mpi4py are absent. `assert_tests_ran` is what stops that from
  # quietly becoming a job that runs nothing.
  integration-simulation:
    name: Simulation tier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Myokit compiles each model against Sundials at run time. The Windows
      # myokit wheel ships its own, so only macOS needs this -- and it is the
      # same serial, non-MPI build release.yml makes, for the same reason:
      # Homebrew's Sundials is MPI-enabled and aborts at run time with
      # "MPI_Comm_dup() called before MPI_INIT" even for a serial model.
      - name: Build serial Sundials (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VER=6.5.1
          curl -fsSL "https://github.com/LLNL/sundials/releases/download/v${VER}/sundials-${VER}.tar.gz" -o sundials.tar.gz
          tar xzf sundials.tar.gz
          cmake -S "sundials-${VER}" -B sundials-build \
            -DCMAKE_INSTALL_PREFIX="$HOME/sundials-serial" \
            -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF \
            -DENABLE_MPI=OFF -DEXAMPLES_ENABLE_C=OFF -DEXAMPLES_INSTALL=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_NAME_DIR=@rpath
          cmake --build sundials-build --target install -j3
          grep -q "SUNDIALS_MPI_ENABLED 0" "$HOME/sundials-serial/include/sundials/sundials_config.h"
        working-directory: .

      - name: Install the app and the simulation stack
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --build-constraint "${{ github.workspace }}/build-constraints.txt" -e ".[dev]"

      - name: Install libcuflynx from the CA integration branch
        shell: bash
        run: |
          pip install --force-reinstall --no-cache-dir \
            --build-constraint "${{ github.workspace }}/build-constraints.txt" \
            "libcuflynx @ git+https://github.com/physiomelinks/circulatory_autogen@master"

      # Fail here rather than in a wall of skips 20 minutes later. Deliberately
      # does NOT require mpiexec -- its absence is the point of this job.
      - name: Assert the environment is the one under test
        shell: bash
        env:
          SUNDIALS_INC: ${{ runner.os == 'macOS' && '/Users/runner/sundials-serial/include' || '' }}
        run: |
          python - <<'PY'
          import importlib.metadata as m, libcuflynx, myokit, libcellml  # noqa: F401
          print(f"libcuflynx {m.version('libcuflynx')}, myokit {myokit.__version__}, libcellml present")
          PY

      - name: Run the simulation tier
        shell: bash
        env:
          CUFLYNX_STRICT_STARTUP: "1"
          # macOS: point Myokit at the serial Sundials built above.
          CUFLYNX_SUNDIALS_ROOT: ${{ runner.os == 'macOS' && '/Users/runner/sundials-serial' || '' }}
        run: |
          pytest -m integration -v --tb=short --junitxml=junit-simulation.xml

      # pytest exits 0 when everything skipped, so without this the job can pass
      # having run none of the tier -- which is the likely failure here, not a red X.
      - name: Fail if the tier did not actually run
        if: always()
        working-directory: .
        shell: bash
        run: |
          python .github/scripts/assert_tests_ran.py --min-ran 40 apps/api/junit-simulation.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-${{ matrix.os }}
          path: apps/api/junit-simulation.xml
          if-no-files-found: ignore

  run-matrix:
    name: Run matrix (serial and parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Sundials
        run: |
          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt || true
          echo 'Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-cuflynx-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y libsundials-dev python3-dev

      - name: Install the app and its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"

      # TEMPORARY, until circulatory_autogen publishes a release containing #466. The
      # declared dependency is
      # `libcuflynx>=0.4.0` from PyPI, which is 0.4.1 and predates the CA changes this
      # release ships with. Installed *after* the app so it overrides that resolution,
      # and still as a real distribution in site-packages -- so
      # CUFLYNX_REQUIRE_INSTALLED_LIBCUFLYNX below still means what it says.
      - name: Install libcuflynx from the CA integration branch
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-cache-dir \
            --build-constraint "${{ github.workspace }}/build-constraints.txt" \
            "libcuflynx[emulation,uq] @ git+https://github.com/physiomelinks/circulatory_autogen@master"

      # The parallel arm is worthless without a launcher, and its absence is *silent*:
      # every build_command falls back to one core with a warning and the run still
      # succeeds. So assert the launcher before running, not after.
      - name: Assert a usable MPI is present
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess, sys
          launcher = pathlib.Path(sys.executable).parent / "mpiexec"
          launcher = str(launcher) if launcher.exists() else shutil.which("mpiexec")
          assert launcher, "no mpiexec -- the parallel arm would quietly run serially"
          from mpi4py import MPI  # noqa: F401
          out = subprocess.run(
              [launcher, "-n", "2", sys.executable, "-c",
               "from mpi4py import MPI; print(MPI.COMM_WORLD.Get_rank())"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=120)
          assert out.returncode == 0, f"a two-rank smoke launch failed:\n{out.stdout}"
          print(f"{launcher} launches mpi4py cleanly")
          PY

      - name: Run the matrix
        env:
          CUFLYNX_STRICT_STARTUP: "1"
        run: |
          pytest tests/test_run_matrix.py -v --tb=short --junitxml=junit-run-matrix.xml

      - name: Fail if the matrix did not actually run
        if: always()
        working-directory: .
        run: |
          python .github/scripts/assert_tests_ran.py \
            --min-ran 14 apps/api/junit-run-matrix.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-matrix
          path: apps/api/junit-run-matrix.xml

  # ---------------------------------------------------------------------------
  # Weekly, with everything resolved at its newest
  # ---------------------------------------------------------------------------
  #
  # The crash that prompted this workflow was not caused by any commit in either repo. It
  # was arviz writing a once-a-day stamp file through a fixed temporary name, so
  # concurrent MPI ranks raced and the losers died on FileNotFoundError -- reached through
  # `corner`, which libcuflynx imported at module scope. Nothing in a pull request would
  # ever have found it: the dependency was already pinned-compatible, the code did not
  # change, and the failure only fires on the first run of a given day.
  #
  # This job is the only thing here that can find that class at all. It resolves every
  # dependency at its newest allowed version, runs the tier, and opens an issue when it
  # breaks -- so the next upstream surprise arrives as a notification rather than as a
  # lost overnight job.
  # The pin in ci.yml names a circulatory_autogen *commit*, and a commit does not age
  # visibly: it sat at ad312754 for months while the tier below tested an engine nobody was
  # shipping, and nothing said so. Weekly, because that is the cadence at which "our CI is
  # testing something no user runs" is worth hearing about, and not on pull requests, where
  # it would fail somebody's unrelated change.
  ca-pin-freshness:
    name: The pinned CA is not far behind
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Compare the pin against the latest libcuflynx release
        env:
          GH_TOKEN: ${{ github.token }}
          # How many releases behind is tolerable. One allows the normal window between a
          # libcuflynx release and the CUFLynx release that adopts it.
          ALLOWED_BEHIND: "1"
        run: |
          set -euo pipefail
          pin="$(grep -oE 'ref: [0-9a-f]{40}' .github/workflows/ci.yml | head -1 | cut -d' ' -f2)"
          if [ -z "$pin" ]; then
            echo "::error::no 40-character CA ref found in ci.yml -- has the pin moved or changed shape?"
            exit 1
          fi
          echo "pinned CA commit: $pin"

          # Every release tag newer than the pinned commit. `--paginate` because the list
          # grows, and the pin can legitimately be several tags back.
          behind=0
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            if [ "$sha" = "$pin" ]; then break; fi
            # Is the pin an ancestor of this tag? If so the tag is newer than the pin.
            if gh api "repos/physiomelinks/circulatory_autogen/compare/$pin...$tag" \
                 --jq '.status' 2>/dev/null | grep -qx "ahead"; then
              behind=$((behind + 1))
            fi
          done < <(gh api repos/physiomelinks/circulatory_autogen/releases --paginate \
                     --jq '.[] | "\(.tag_name) \(.target_commitish)"' | head -20)

          echo "libcuflynx releases newer than the pin: $behind (tolerated: $ALLOWED_BEHIND)"
          if [ "$behind" -gt "$ALLOWED_BEHIND" ]; then
            echo "::error::the CA pin in ci.yml is $behind libcuflynx releases behind. The"
            echo "::error::integration tier is testing an engine no user runs. Bump both"
            echo "::error::`ref:` lines to the current release's merge commit."
            exit 1
          fi

  dependency-upgrade:
    name: Weekly dependency upgrade
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Sundials
        run: |
          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt || true
          echo 'Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-cuflynx-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y libsundials-dev python3-dev

      # --upgrade --upgrade-strategy eager is the whole point: take the newest of
      # everything the pins allow, including transitive dependencies, which is where the
      # arviz change came from.
      - name: Install everything at its newest allowed version
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager \
            --build-constraint "${{ github.workspace }}/build-constraints.txt" \
            -e ".[dev,analysis,full]"

      # TEMPORARY, until circulatory_autogen publishes a release containing #466. The
      # declared dependency is
      # `libcuflynx>=0.4.0` from PyPI, which is 0.4.1 and predates the CA changes this
      # release ships with. Installed *after* the app so it overrides that resolution,
      # and still as a real distribution in site-packages -- so
      # CUFLYNX_REQUIRE_INSTALLED_LIBCUFLYNX below still means what it says.
      - name: Install libcuflynx from the CA integration branch
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-cache-dir \
            --build-constraint "${{ github.workspace }}/build-constraints.txt" \
            "libcuflynx[emulation,uq] @ git+https://github.com/physiomelinks/circulatory_autogen@master"

      - name: Record what was resolved
        if: always()
        run: pip freeze | tee resolved-versions.txt

      - name: Run the integration tier and the run matrix
        id: tests
        env:
          CUFLYNX_REQUIRE_INSTALLED_LIBCUFLYNX: "1"
          CUFLYNX_STRICT_STARTUP: "1"
          # The deliberate worst-case import probes. They are skipped on pull requests
          # because they are known to fail against a libcuflynx that still imports corner
          # at module scope; here, finding out is the job.
          CUFLYNX_ASSERT_UPSTREAM_IMPORTS: "1"
        run: |
          pytest -m integration tests/test_run_matrix.py -v --tb=short \
            --junitxml=junit-upgrade.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-upgrade
          path: |
            apps/api/junit-upgrade.xml
            apps/api/resolved-versions.txt

      # An email nobody reads is not a signal. An issue is.
      - name: Open an issue when the newest dependencies break the tier
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Weekly dependency upgrade is failing";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "dependencies",
            });
            const already = existing.data.find(i => i.title === title);
            const body = [
              "The weekly job that resolves every dependency at its newest allowed",
              "version failed. That is what this job is for: the crash it was built after",
              "came from an upstream release, not from a commit here.",
              "",
              `Run: ${run}`,
              "",
              "`resolved-versions.txt` in the run's artifacts holds the exact resolution.",
              "Compare it against the last green run to find what moved.",
            ].join("\n");
            if (already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: already.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["dependencies"],
              });
            }
