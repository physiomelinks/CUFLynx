[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuflynx-api"
# Single-sourced from version.py (see [tool.hatch.version] below) so a release
# cannot bump one copy of the number and leave the others behind.
dynamic = ["version"]
description = "FastAPI backend for the CellML slider-visualisation app"
# No `readme` key. It pointed at ../../README.md, and hatchling refuses a readme
# outside the project directory ("Readme path must be within the project
# directory"), so `pip install -e .` failed outright on a fresh clone. Older
# hatchling tolerated it, which is why this sat here working until a new
# environment resolved a newer build backend.
#
# Dropped rather than worked around: this package is only ever installed from
# source into a venv, never published, so the long-description metadata is
# decoration. A copy of the README here would be a second one to keep in step,
# and a symlink breaks on Windows. The README lives at the repo root, which is
# where anyone reading the project looks for it.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "numpy>=1.24.0",
    "pandas>=1.3.0",
    "python-multipart>=0.0.9",
    # The modelling engine. `engine.py` imports it in-process for live simulation, the
    # runners import it out-of-process, and packaging/cuflynx.spec collects it into the
    # bundle -- so it is a dependency of the app, not an optional extra. It was left
    # undeclared while circulatory_autogen was only ever a sibling checkout on
    # PYTHONPATH; now that it is on PyPI, saying so is what makes a build environment
    # reproducible. (A CA directory chosen in Settings still overrides it: ca_imports
    # puts that checkout ahead of the installed package.)
    # 0.5.0 is the floor, not 0.4.x: this app speaks the obs_data vocabulary CA's #466
    # introduced there -- `data_item_name` (unique) and the two plotting labels -- and it
    # tells a user with an older file to convert it with `cuflynx-migrate-obs-data`, which
    # 0.5.0 is what ships. Resolving 0.4.1 underneath would leave the app explaining a
    # migration to an engine that has not made it.
    "libcuflynx>=0.5.0",
    # Myokit JIT-compiles each model to a CPython extension at run time, inside the
    # frozen process, and that compile uses setuptools' build_ext command. Python <=3.11
    # venvs happen to ship setuptools, which is why relying on it has worked so far; 3.12
    # removed it from the default venv, and packaging/cuflynx.spec requires it either way.
    "setuptools>=60",
    # CellML simulation (circulatory_autogen Myokit path).
    # Required only for the integration tier; unit tests run without them.
    "myokit>=1.39.1",
    # Upper bound is load-bearing — keep it in step with circulatory_autogen's own
    # pin. libcellml 0.7 changed the generated Python code (no VARIABLE_COUNT), and
    # CA's PythonGenerator still expects it, so the python / casadi_python backends
    # die with KeyError: 'VARIABLE_COUNT'. Without the bound a fresh `pip install`
    # silently resolves 0.7.0 — which is exactly how the v0.1.0 desktop build
    # shipped broken while a dev machine holding 0.6.3 looked fine.
    "libcellml>=0.6.3,<0.7.0",
    "scipy>=1.7.0",
    # circulatory_autogen's *simulation-path* imports. The live engine imports CA
    # in-process, so these have to be present in whatever environment runs the app —
    # including the frozen desktop bundle, whose contents come from a clean install
    # of this file. They were missing, and because a dev machine has them installed
    # for CA anyway, local builds bundled them and only the CI-built binary was
    # broken ("CasADi solver requested but CasADi is not available").
    # Versions track circulatory_autogen's own pins.
    "casadi>=3.7.2",        # casadi_python backend (compiler-free)
    "sympy>=1.8.0",
    "pyyaml>=5.4.0",        # also imported directly by main.py
    "ruamel.yaml>=0.17.0",
    "rdflib>=5.0.0",
    "pint>=0.18",
    # circulatory_autogen's *cost-gradient* imports, which are in-process too. #188
    # put the analytic cost gradient in the live tier: cost_gradient.py imports CA's
    # param_id.paramID, and that reaches an unguarded `import numdifftools` in CA's
    # utilities/utility_funcs.py, then scikit-learn. Both were declared only in
    # [analysis] below — the *subprocess* tier — so a source install (scripts/install.py
    # runs `pip install -e ".[dev]"`) never got them, and neither would a frozen build
    # without that extra. The failure is silent rather than loud: cost_gradient raises
    # GradientUnavailable("No module named 'numdifftools'"), the route catches it and
    # differences instead, so the user gets a gradient that is ~10x slower and, for a
    # parameter the cost barely depends on, of arbitrary sign (see cost_gradient's own
    # measurements). Same shape as the casadi/sympy gap above: a dev machine has these
    # installed for CA anyway, so only a clean environment shows it.
    "numdifftools>=0.9.0",
    "scikit-learn",
    # NB: CA's *analysis* deps (emcee, SALib, nevergrad, mpi4py, matplotlib, ...) live
    # in the [analysis] extra below — the self-contained desktop build bundles them
    # so analysis runs in-app. They're not core runtime deps for a source install.
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
# Desktop shell + single-file packaging (scripts/package.py). Not needed to run
# the app from source, only to build/ship the double-clickable executable.
desktop = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]
# circulatory_autogen's *analysis* dependencies. The self-contained desktop build
# bundles these so sensitivity / calibration / UQ run in the app's own interpreter
# (the exe re-invokes itself as the runner) — no external Python required. Versions
# track circulatory_autogen's own pins. mpi4py is imported unconditionally by CA's
# param_id modules (even single-core), so it's required, not optional; it needs an
# MPI runtime present at build time (the spec bundles the runtime libs).
analysis = [
    "matplotlib>=3.3.0",
    "emcee>=3.0.0",
    "corner>=2.2.0",
    "SALib==1.5.1",
    "seaborn>=0.11.0",
    "statsmodels>=0.12.0",
    "schwimmbad>=0.3.0",
    "nevergrad>=1.0.12",
    # numdifftools and scikit-learn moved up to the core dependencies: the in-process
    # cost gradient needs them, so they are not optional. Listing them here as well
    # would say they are only wanted for analysis, which is what caused the gap.
    "tqdm>=4.62.0",
    "mpi4py>=3.0.0",
    # A pip-installable, fully self-contained MPICH runtime (libmpi + libfabric/ucx),
    # so the bundle needs NO system MPI on the user's machine. mpi4py's wheel loads
    # this MPICH variant. Not on Windows (no wheel) — Windows uses Microsoft MPI.
    "mpich>=4.0; platform_system != 'Windows'",
]

# The extra Linux bundle (CUFLynx-linux-x86_64-full). Everything above gives the app
# simulation, sensitivity, calibration and the emcee UQ sampler in its own interpreter;
# this adds the two features that were still "install your own Python and point Settings
# at it": surrogate emulators and the pyMC UQ backend.
#
# Deliberately NOT folded into [analysis]. autoemulate pulls torch, gpytorch, pyro-ppl and
# lightgbm -- roughly 750 MB, which would take every platform's binary from ~300 MB to
# ~1 GB for a feature most users never touch -- and it requires Python <3.13, which would
# pin the whole matrix's ceiling to what one optional dependency supports. So it is a
# second Linux asset rather than a change to the four existing ones.
#
# The packages are named here as well as coming in through libcuflynx's own extras,
# for the same reason [analysis] duplicates CA's pins: packaging/cuflynx.spec collects
# them by name and refuses to build without them, and tests/test_spec_requirements.py
# checks this file declares everything the spec collects. A transitive dependency
# satisfies the build but leaves that guard with nothing to read.
full = [
    "libcuflynx[emulation,uq]>=0.5.0",
    # Surrogate models -- CA's do_emulation / use_emulator, and the Emulator tab's live
    # prediction line, which currently needs a user-supplied interpreter.
    "autoemulate>=2.1,<3",
    # The pyMC UQ backend. CA's built-in emcee sampler is in [analysis] already; this is
    # the alternative CA offers, and pytensor is named because the spec collects it
    # explicitly (it ships C templates it compiles at run time, so its data files matter).
    "pymc>=5.0",
    "arviz>=0.15",
    "pytensor>=2.18",
]

[tool.hatch.version]
path = "version.py"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "version.py",
    "engine.py",
    "cellml_meta.py",
    "obs_data.py",
    "params_for_id.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires myokit and circulatory_autogen (real CellML simulation)",
    "slow: runs a real pipeline stage; minutes rather than seconds",
]
